name: "Regulatory Signals repo check"
description: "Run Regulatory Signals deterministic checks (unchecked fetch responses, silent webhook success, button-to-route gaps, webhook verification) on a public GitHub repository and write the result to the job summary."
author: "Regulatory Signals"
branding:
  icon: "shield"
  color: "blue"
inputs:
  api-key:
    description: "Regulatory Signals API key (store it as a repository secret)."
    required: true
  repo-url:
    description: "GitHub repository URL to check. Defaults to the repository running the workflow. Public repositories only."
    required: false
    default: ""
  fail-on-findings:
    description: "Set to 'true' to fail the job when a check reports a problem. Default 'false' (report only)."
    required: false
    default: "false"
  api-url:
    description: "Base URL of the Regulatory Signals API."
    required: false
    default: "https://www.regulatorysignals.com"
outputs:
  findings:
    description: "Number of checks that reported a problem."
    value: ${{ steps.scan.outputs.findings }}
runs:
  using: "composite"
  steps:
    - id: scan
      shell: bash
      env:
        RS_API_KEY: ${{ inputs.api-key }}
        RS_REPO_URL: ${{ inputs.repo-url != '' && inputs.repo-url || format('{0}/{1}', github.server_url, github.repository) }}
        RS_FAIL: ${{ inputs.fail-on-findings }}
        RS_API_URL: ${{ inputs.api-url }}
      run: bash "${{ github.action_path }}/scan.sh"
